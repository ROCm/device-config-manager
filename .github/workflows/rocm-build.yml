name: DCM Build

# Builds DCM container image against a ROCm tarball.
# Job graph: read-version → resolve (shared) → build → publish (shared) → validate (shared) → results
# Triggers: nightly (cron), PR (path-filtered), pre-release (workflow_dispatch)

on:
  schedule:
    - cron: '0 13 * * *'

  pull_request:
    branches:
      - '**'
    paths:
      - '.github/workflows/rocm-build.yml'
      - 'docker/**'
      - 'Makefile'

  workflow_dispatch:
    inputs:
      rocm_tarball_url:
        description: 'ROCm tarball URL (leave blank to auto-detect)'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Docker image tag (e.g. 10.1.0a20260817). Auto-derived if blank.'
        required: false
        type: string
        default: ''
      force_rebuild:
        description: 'Force rebuild even if already built for this SHA + image tag'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.event_name == 'schedule' && 'dcm-nightly' || github.event_name == 'pull_request' && format('dcm-pr-{0}', github.event.pull_request.number) || format('dcm-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write
  actions: write

jobs:

  read-version:
    name: Read version from Makefile
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      tarball_url: ${{ steps.v.outputs.tarball_url }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          echo "version=$(grep -m1 'PROJECT_VERSION ?=' Makefile | awk '{print $NF}' | tr -d '\"')" >> "$GITHUB_OUTPUT"
          echo "tarball_url=$(grep -m1 'ROCM_TARBALL_URL ?=' Makefile | awk '{print $NF}')" >> "$GITHUB_OUTPUT"

  resolve:
    name: Resolve
    needs: read-version
    uses: ROCm/common-infra-operator/.github/workflows/rocm-resolve.yml@main
    with:
      component: dcm
      version: ${{ needs.read-version.outputs.version }}
      tarball_url_default: ${{ needs.read-version.outputs.tarball_url }}
      s3_component_prefix: device-config-manager
      s3_bucket: ${{ vars.THEROCK_BUCKET_NAME }}
      trigger_event: ${{ github.event_name }}
      trigger_sha: ${{ github.sha }}
      input_tarball_url: ${{ inputs.rocm_tarball_url }}
      input_image_tag: ${{ inputs.image_tag }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets:
      ROCK_CI_S3_SECRET: ${{ secrets.ROCK_CI_S3_SECRET }}

  build:
    name: Build
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build DCM image
        env:
          ROCM_TARBALL_URL: ${{ needs.resolve.outputs.rocm_tarball_url }}
          DCM_IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
        run: make default

      - name: Rename artifact with final name
        env:
          DCM_VERSION: ${{ needs.resolve.outputs.version }}
          SUFFIX: ${{ needs.resolve.outputs.suffix }}
        run: |
          mv "docker/obj/config-manager-ubi9-latest.tgz" \
             "docker/obj/config-manager-${DCM_VERSION}-${SUFFIX}.tgz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcm-image-${{ needs.resolve.outputs.image_tag }}
          retention-days: 1
          path: docker/obj/config-manager-*.tgz

  publish:
    name: Publish
    needs: [resolve, build]
    if: >-
      always() && needs.resolve.outputs.build_needed == 'true'
      && github.event_name != 'pull_request'
      && needs.build.result == 'success'
    uses: ROCm/common-infra-operator/.github/workflows/rocm-publish.yml@main
    with:
      component: dcm
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      version: ${{ needs.resolve.outputs.version }}
      suffix: ${{ needs.resolve.outputs.suffix }}
      s3_prefix: ${{ needs.resolve.outputs.s3_prefix }}
      trigger_sha: ${{ github.sha }}
      s3_bucket: ${{ vars.THEROCK_BUCKET_NAME }}
      artifact_names: "dcm-image-${{ needs.resolve.outputs.image_tag }}"
      s3_file_globs: "*.tgz"
      docker_images: |
        config-manager-*.tgz|rocm/device-config-manager:${{ needs.resolve.outputs.image_tag }}|amdpsdo/device-config-manager:${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}|false
    secrets:
      ROCK_CI_S3_SECRET: ${{ secrets.ROCK_CI_S3_SECRET }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}

  validate:
    name: Validate
    needs: [resolve, build, publish]
    if: >-
      always() && needs.resolve.outputs.build_needed == 'true'
      && needs.build.result == 'success'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    uses: ROCm/common-infra-operator/.github/workflows/rocm-orchestrator.yml@main
    with:
      component: dcm
      scenario: ${{ needs.resolve.outputs.scenario }}
      s3_prefix: ${{ needs.resolve.outputs.s3_prefix }}

  results:
    name: Results
    needs: [resolve, build, publish, validate]
    if: always() && needs.resolve.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Determine overall status
        id: status
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VALIDATE_JOB: ${{ needs.validate.result }}
          VALIDATE_OUTPUT: ${{ needs.validate.outputs.result }}
        run: |
          if [ "${BUILD_RESULT}" != "success" ]; then
            STATUS="BUILD_FAILED"
          elif [ "${PUBLISH_RESULT}" != "success" ] && [ "${PUBLISH_RESULT}" != "skipped" ]; then
            STATUS="PUBLISH_FAILED"
          elif [ "${VALIDATE_JOB}" = "success" ] && [ "${VALIDATE_OUTPUT}" = "pass" ]; then
            STATUS="PASSED"
          elif [ "${VALIDATE_JOB}" = "success" ]; then
            STATUS="FAILED"
          elif [ "${VALIDATE_JOB}" = "cancelled" ]; then
            STATUS="CANCELLED"
          else
            STATUS="ERROR"
          fi
          echo "status=${STATUS}" >> "$GITHUB_OUTPUT"

      - name: Post summary
        env:
          STATUS: ${{ steps.status.outputs.status }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          SCENARIO: ${{ needs.resolve.outputs.scenario }}
          VERSION: ${{ needs.resolve.outputs.version }}
          SUFFIX: ${{ needs.resolve.outputs.suffix }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          VALIDATE_OUTPUT: ${{ needs.validate.outputs.result }}
        run: |
          {
            echo "## DCM Build Results — \`${SCENARIO}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Overall | **${STATUS}** |"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Suffix | \`${SUFFIX}\` |"
            echo "| Build | ${BUILD_RESULT} |"
            echo "| Publish | ${PUBLISH_RESULT} |"
            echo "| Validate (job) | ${VALIDATE_RESULT} |"
            echo "| Validate (output) | ${VALIDATE_OUTPUT:-n/a} |"
          } >> "$GITHUB_STEP_SUMMARY"

