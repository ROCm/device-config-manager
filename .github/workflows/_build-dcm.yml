name: Build DCM

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      rocm_tarball_url:
        required: true
        type: string
      version:
        required: true
        type: string
      suffix:
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:

  build-dcm:
    name: Build DCM
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free up runner disk space
        uses: ROCm/common-infra-operator/.github/actions/free-disk-space@51769beb79300d5c2787fb5bd161e93c922355fb

      - name: Build DCM image
        env:
          ROCM_TARBALL_URL: ${{ inputs.rocm_tarball_url }}
          DCM_IMAGE_TAG:    ${{ inputs.image_tag }}
        run: make default

      - name: Stage artifact with final name
        env:
          DCM_VERSION: ${{ inputs.version }}
          SUFFIX:      ${{ inputs.suffix }}
        run: |
          set -euo pipefail
          mkdir -p staging
          mv "docker/obj/config-manager-ubi9-latest.tgz" \
             "staging/config-manager-${DCM_VERSION}-${SUFFIX}.tgz"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dcm-image-${{ inputs.image_tag }}
          retention-days: 1
          path: staging/
