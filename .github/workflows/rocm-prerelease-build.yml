name: DCM Pre-Release Build

# Builds DCM container image against a ROCm RC or GA tarball.
# Provide dcm_version (e.g. v1.5.3) and rocm_version (e.g. 10.1.0rc4 or 10.1.0).
# When rocm_version contains rc (e.g. 10.1.0rc4), uses rc.repo.amd.com.
# When rocm_version has no rc suffix (e.g. 10.1.0), uses stable.repo.amd.com (GA build).
# Artifacts land at: device-config-manager/pre-release/{dcm_version}-{rocm_version}-{N}/
# Image tag format:  {dcm_version}-{rocm_version}-{N}  e.g. v1.5.3-10.1.0rc4-1
#
# Job graph: resolve → build-dcm → publish → results

on:
  workflow_dispatch:
    inputs:
      dcm_version:
        description: 'DCM version (e.g. v1.5.3)'
        required: true
        type: string
      rocm_version:
        description: 'ROCm version (e.g. 10.1.0rc4 for RC build, or 10.1.0 for GA build)'
        required: true
        type: string
      force_rebuild:
        description: 'Force rebuild even if already built for this tarball + SHA'
        required: false
        type: boolean
        default: false

concurrency:
  group: dcm-prerelease-${{ inputs.dcm_version }}-${{ inputs.rocm_version }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  actions: write

jobs:

  resolve:
    name: Resolve
    uses: ROCm/common-infra-operator/.github/workflows/rocm-resolve.yml@840846bb5b34109a358b36e644dc73246f5e1eb6
    with:
      component: dcm
      version: ${{ inputs.dcm_version }}
      rocm_version: ${{ inputs.rocm_version }}
      s3_component_prefix: device-config-manager
      s3_bucket: ${{ vars.THEROCK_BUCKET_NAME }}
      trigger_event: pre-release
      trigger_sha: ${{ github.sha }}
      force_rebuild: ${{ inputs.force_rebuild || false }}
    secrets:
      ROCK_CI_S3_SECRET: ${{ secrets.ROCK_CI_S3_SECRET }}

  build-dcm:
    name: Build DCM
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    uses: ./.github/workflows/_build-dcm.yml
    with:
      image_tag:        ${{ needs.resolve.outputs.image_tag }}
      rocm_tarball_url: ${{ needs.resolve.outputs.rocm_tarball_url }}
      version:          ${{ needs.resolve.outputs.version }}
      suffix:           ${{ needs.resolve.outputs.suffix }}

  publish:
    name: Publish
    needs: [resolve, build-dcm]
    if: >-
      always() && needs.resolve.outputs.build_needed == 'true'
      && needs.build-dcm.result == 'success'
    uses: ROCm/common-infra-operator/.github/workflows/rocm-publish.yml@840846bb5b34109a358b36e644dc73246f5e1eb6
    with:
      component: dcm
      image_tag:            ${{ needs.resolve.outputs.image_tag }}
      rocm_tarball_version: ${{ needs.resolve.outputs.rocm_tarball_version }}
      all_builds_succeeded: ${{ needs.build-dcm.result == 'success' }}
      version:              ${{ needs.resolve.outputs.version }}
      suffix:               ${{ needs.resolve.outputs.suffix }}
      s3_prefix:            ${{ needs.resolve.outputs.s3_prefix }}
      trigger_sha:          ${{ github.sha }}
      s3_bucket:            ${{ vars.THEROCK_BUCKET_NAME }}
      artifact_names:       "dcm-image-${{ needs.resolve.outputs.image_tag }}"
      s3_file_globs:        "*.tgz"
      docker_images: |
        config-manager-*.tgz|rocm/device-config-manager:${{ needs.resolve.outputs.image_tag }}|amdpsdo/device-config-manager:${{ needs.resolve.outputs.version }}-${{ needs.resolve.outputs.suffix }}|false
    secrets:
      ROCK_CI_S3_SECRET: ${{ secrets.ROCK_CI_S3_SECRET }}
      DOCKER_TOKEN:      ${{ secrets.DOCKER_TOKEN }}
      DOCKER_USERNAME:   ${{ vars.DOCKER_USERNAME }}

  results:
    name: Results
    needs: [resolve, build-dcm, publish]
    if: always() && needs.resolve.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Post summary
        env:
          IMAGE_TAG:      ${{ needs.resolve.outputs.image_tag }}
          VERSION:        ${{ needs.resolve.outputs.version }}
          SUFFIX:         ${{ needs.resolve.outputs.suffix }}
          S3_PREFIX:      ${{ needs.resolve.outputs.s3_prefix }}
          S3_BUCKET:      ${{ vars.THEROCK_BUCKET_NAME }}
          BUILD_RESULT:   ${{ needs.build-dcm.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          {
            echo "## DCM Pre-Release Build Results"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Image tag | \`${IMAGE_TAG}\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Suffix | \`${SUFFIX}\` |"
            echo "| Build DCM | ${BUILD_RESULT} |"
            echo "| Publish | ${PUBLISH_RESULT} |"
            [ -n "${S3_PREFIX}" ] && [ "${PUBLISH_RESULT}" = "success" ] && echo "| S3 location | \`s3://${S3_BUCKET}/${S3_PREFIX}/\` |" || true
          } >> "$GITHUB_STEP_SUMMARY"
